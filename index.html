/* seeded RNG for stable chart history per symbol/timeframe */
function mulberry32(a){ return function(){ a|=0;a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function seedFromStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h<<5)-h+s.charCodeAt(i); h|=0; } return h; }
 
function generateSeries(symbol, timeframe, endPrice){
  const count = 90;
  const rng = mulberry32(seedFromStr(symbol+timeframe));
  const vol = symbol.startsWith('XAU') ? endPrice*0.003 : symbol.startsWith('XAG') ? endPrice*0.006 : symbol.includes('JPY') ? endPrice*0.0009 : endPrice*0.0011;
  let price = endPrice * (1 - vol*0.02*count/90*3.2*(0.5));
  // walk forward to end near endPrice using bridge technique
  const raw = [];
  let p = endPrice;
  for(let i=count-1;i>=0;i--){
    raw[i] = p;
    const drift = (rng()-0.5)*vol;
    p = p - drift;
  }
  const candles = [];
  for(let i=0;i<count;i++){
    const o = raw[i];
    const c = i<count-1 ? raw[i+1] : endPrice;
    const wig = vol*0.6;
    const h = Math.max(o,c) + rng()*wig;
    const l = Math.min(o,c) - rng()*wig;
    candles.push({t:i, o, h, l, c});
  }
  candles[candles.length-1].c = endPrice;
  candles[candles.length-1].h = Math.max(candles[candles.length-1].h, endPrice);
  candles[candles.length-1].l = Math.min(candles[candles.length-1].l, endPrice);
  return candles;
}

function seedHistory(){
  const rng = mulberry32(777);
  const rows = [];
  const syms = INSTRUMENTS.map(i=>i.symbol);
  for(let i=0;i<18;i++){
    const sym = syms[Math.floor(rng()*syms.length)];
    const type = rng()>0.5?'BUY':'SELL';
    const vol = (Math.floor(rng()*5)+1)*0.1;
    const inst = INSTRUMENTS.find(x=>x.symbol===sym);
    const entry = inst.base*(1+(rng()-0.5)*0.01);
    const exit = entry*(1+(rng()-0.5)*0.015);
    const cs = contractSize(sym);
    let pnl = type==='BUY' ? (exit-entry)*cs*vol : (entry-exit)*cs*vol;
    pnl = Math.round(pnl*100)/100;
    const openTs = now() - Math.floor(rng()*20+1)*86400000 - Math.floor(rng()*8)*3600000;
    const closeTs = openTs + Math.floor(rng()*6+1)*3600000;
    rows.push({
      id: uid('h'), ticket: 900000+i, symbol: sym, type, volume: vol,
      entry: entry, exit: exit, openTs, closeTs,
      commission: -(vol*3.5), swap: Math.round((rng()-0.6)*4*100)/100,
      profit: pnl, digits: digitsOf(sym)
    });
  }
  return rows.sort((a,b)=>b.closeTs-a.closeTs);
}

function calcMargin(symbol, volume, price){ return (price*contractSize(symbol)*volume)/LEVERAGE; }
function calcPipValue(symbol, volume){ return pipSize(symbol)*contractSize(symbol)*volume; }
function calcPnL(pos, price){
  const cs = contractSize(pos.symbol);
  if(pos.type==='BUY') return (price.bid - pos.openPrice)*cs*pos.volume;
  return (pos.openPrice - price.ask)*cs*pos.volume;
}
 
function reducer(state, action){
  switch(action.type){
    case 'ENTER_DEMO': return {...state, page:'dashboard'};
    case 'SET_PAGE': return {...state, page: action.page};
    case 'SET_THEME': return {...state, theme: action.theme};
    case 'TOGGLE_SIM': return {...state, liveSim: !state.liveSim};
    case 'SELECT_SYMBOL': return {...state, selectedSymbol: action.symbol, page: state.page==='login'?'trade':state.page};
    case 'SET_CHART_TF': return {...state, chartTF: action.tf};
    case 'SET_CHART_TYPE': return {...state, chartType: action.ct};
    case 'TOGGLE_INDICATOR': return {...state, chartIndicators:{...state.chartIndicators, [action.key]: !state.chartIndicators[action.key]}};
    case 'TOGGLE_FAVORITE': {
      const has = state.favorites.includes(action.symbol);
      return {...state, favorites: has ? state.favorites.filter(s=>s!==action.symbol) : [...state.favorites, action.symbol]};
    }
    case 'MARKET_FILTER': return {...state, marketFilter: action.value};
    case 'MARKET_SORT': {
      const cur = state.marketSort;
      const dir = cur.key===action.key ? -cur.dir : 1;
      return {...state, marketSort:{key:action.key, dir}};
    }
    case 'ADD_TOAST': return {...state, toasts:[...state.toasts, {id:uid('t'), text:action.text, kind:action.kind||'success'}]};
    case 'DISMISS_TOAST': return {...state, toasts: state.toasts.filter(t=>t.id!==action.id)};
    case 'ADD_NOTIF': return {...state, notifications:[{id:uid('nt'), text:action.text, ts:now(), read:false, kind:action.kind||'info'}, ...state.notifications].slice(0,40)};
    case 'MARK_NOTIFS_READ': return {...state, notifications: state.notifications.map(n=>({...n, read:true}))};
    case 'ADD_WATCH': {
      const list = state.watchlists[action.group] || [];
      if(list.includes(action.symbol)) return state;
      return {...state, watchlists:{...state.watchlists, [action.group]:[...list, action.symbol]}};
    }
    case 'REMOVE_WATCH': {
      const list = state.watchlists[action.group] || [];
      return {...state, watchlists:{...state.watchlists, [action.group]: list.filter(s=>s!==action.symbol)}};
    }
    case 'CREATE_WATCHLIST_GROUP': {
      if(state.watchlists[action.name]) return state;
      return {...state, watchlists:{...state.watchlists, [action.name]: []}};
    }
    case 'UPDATE_SETTINGS': return {...state, settings:{...state.settings, ...action.patch}};
 
    case 'PLACE_ORDER': {
      const { symbol, orderType, direction, volume, entryPrice, sl, tp } = action.payload;
      const price = state.prices[symbol];
      if(orderType==='Market'){
        const openPrice = direction==='BUY' ? price.ask : price.bid;
        const pos = {
          id: uid('p'), ticket: Math.floor(500000+Math.random()*90000),
          symbol, type: direction, volume, openPrice, sl: sl||0, tp: tp||0,
          openTs: now(), commission: -(volume*3.5), swap:0
        };
        return {...state, positions:[pos, ...state.positions]};
      } else {
        const typeLabel = direction+' '+orderType.toUpperCase();
        const ord = { id: uid('o'), ticket: Math.floor(500000+Math.random()*90000), symbol, type: typeLabel, volume, entryPrice, sl: sl||0, tp: tp||0, createdTs: now() };
        return {...state, pendingOrders:[ord, ...state.pendingOrders]};
      }
    }
    case 'MODIFY_POSITION': {
      return {...state, positions: state.positions.map(p=> p.id===action.id ? {...p, sl:action.sl, tp:action.tp} : p)};
    }
    case 'CLOSE_POSITION': {
      const pos = state.positions.find(p=>p.id===action.id);
      if(!pos) return state;
      const price = state.prices[pos.symbol];
      const pnl = calcPnL(pos, price) * (action.fraction||1);
      const exitPrice = pos.type==='BUY' ? price.bid : price.ask;
      const histRow = {
        id: uid('h'), ticket: pos.ticket, symbol: pos.symbol, type: pos.type,
        volume: pos.volume*(action.fraction||1), entry: pos.openPrice, exit: exitPrice,
        openTs: pos.openTs, closeTs: now(), commission: pos.commission*(action.fraction||1),
        swap: pos.swap*(action.fraction||1), profit: Math.round(pnl*100)/100, digits: digitsOf(pos.symbol)
      };
      let positions;
      if(action.fraction && action.fraction<1){
        positions = state.positions.map(p=> p.id===action.id ? {...p, volume: Math.round((p.volume*(1-action.fraction))*100)/100} : p);
      } else {
        positions = state.positions.filter(p=>p.id!==action.id);
      }
      return {
        ...state, positions, history:[histRow, ...state.history],
        account: {...state.account, balance: state.account.balance + pnl + pos.commission*(action.fraction&&action.fraction<1?action.fraction:1)*0}
      };
    }
    case 'CANCEL_PENDING': return {...state, pendingOrders: state.pendingOrders.filter(o=>o.id!==action.id)};
    case 'MODIFY_PENDING': return {...state, pendingOrders: state.pendingOrders.map(o=> o.id===action.id ? {...o, entryPrice:action.entryPrice, sl:action.sl, tp:action.tp} : o)};
    case 'TRIGGER_PENDING': {
      const ord = state.pendingOrders.find(o=>o.id===action.id);
      if(!ord) return state;
      const direction = ord.type.startsWith('BUY') ? 'BUY' : 'SELL';
      const pos = { id: uid('p'), ticket: ord.ticket, symbol: ord.symbol, type: direction, volume: ord.volume, openPrice: ord.entryPrice, sl: ord.sl, tp: ord.tp, openTs: now(), commission:-(ord.volume*3.5), swap:0 };
      return {
        ...state,
        pendingOrders: state.pendingOrders.filter(o=>o.id!==action.id),
        positions: [pos, ...state.positions],
      };
    }
    case 'CREATE_ALERT': return {...state, alerts:[{id:uid('a'), triggered:false, active:true, ...action.payload}, ...state.alerts]};
    case 'DELETE_ALERT': return {...state, alerts: state.alerts.filter(a=>a.id!==action.id)};
    case 'ACK_ALERT': return {...state, alerts: state.alerts.map(a=> a.id===action.id ? {...a, triggered:true, active:false} : a)};
    case 'DEPOSIT': return {...state, account:{...state.account, balance: state.account.balance+action.amount}, walletTx:[{id:uid('w'), type:'Deposit', amount:action.amount, ts:now(), note:'Demo deposit'}, ...state.walletTx]};
    case 'WITHDRAW': return {...state, account:{...state.account, balance: state.account.balance-action.amount}, walletTx:[{id:uid('w'), type:'Withdrawal', amount:-action.amount, ts:now(), note:'Demo withdrawal'}, ...state.walletTx]};
    case 'UPDATE_PROFILE': return {...state, account: {...state.account, ...action.patch}};
 
    case 'TICK': {
      const prices = {};
      Object.entries(state.prices).forEach(([sym, p])=>{
        const inst = INSTRUMENTS.find(i=>i.symbol===sym);
        const vol = sym.startsWith('XAU') ? p.mid*0.00025 : sym.startsWith('XAG') ? p.mid*0.0005 : sym.includes('JPY') ? p.mid*0.00012 : p.mid*0.00009;
        const delta = (Math.random()-0.5)*vol*2;
        const mid = Math.max(0.0001, p.mid + delta);
        const spread = SPREAD_PIPS[sym]*pipSize(sym);
        prices[sym] = {
          mid, bid: mid-spread/2, ask: mid+spread/2,
          dayOpen: p.dayOpen, high: Math.max(p.high, mid), low: Math.min(p.low, mid),
          prevMid: p.mid, dir: mid>p.mid?1:mid<p.mid?-1:0
        };
      });
      // recompute positions pnl implicitly via render; check SL/TP + pending triggers + alerts
      let positions = state.positions;
      let history = state.history;
      let balance = state.account.balance;
      let notifications = state.notifications;
      let toasts = state.toasts;
      const stillOpen = [];
      state.positions.forEach(pos=>{
        const price = prices[pos.symbol];
        let closePrice = null, reason=null;
        if(pos.type==='BUY'){
          if(pos.sl && price.bid<=pos.sl){ closePrice=pos.sl; reason='Stop Loss'; }
          else if(pos.tp && price.bid>=pos.tp){ closePrice=pos.tp; reason='Take Profit'; }
        } else {
          if(pos.sl && price.ask>=pos.sl){ closePrice=pos.sl; reason='Stop Loss'; }
          else if(pos.tp && price.ask<=pos.tp){ closePrice=pos.tp; reason='Take Profit'; }
        }
        if(closePrice){
          const cs = contractSize(pos.symbol);
          const pnl = pos.type==='BUY' ? (closePrice-pos.openPrice)*cs*pos.volume : (pos.openPrice-closePrice)*cs*pos.volume;
          history = [{id:uid('h'), ticket:pos.ticket, symbol:pos.symbol, type:pos.type, volume:pos.volume, entry:pos.openPrice, exit:closePrice, openTs:pos.openTs, closeTs:now(), commission:pos.commission, swap:pos.swap, profit:Math.round(pnl*100)/100, digits:digitsOf(pos.symbol)}, ...history];
          balance += pnl;
          const text = `${reason} reached — ${pos.symbol} ${pos.type} closed at ${closePrice.toFixed(digitsOf(pos.symbol))}`;
          notifications = [{id:uid('nt'), text, ts:now(), read:false, kind: reason==='Take Profit'?'success':'warn'}, ...notifications].slice(0,40);
          toasts = [...toasts, {id:uid('t'), text, kind: reason==='Take Profit'?'success':'warn'}];
        } else {
          stillOpen.push(pos);
        }
      });
      positions = stillOpen;
      // pending order triggers
      let pendingOrders = [];
      state.pendingOrders.forEach(ord=>{
        const price = prices[ord.symbol];
        let trig=false;
        if(ord.type==='BUY LIMIT' && price.ask<=ord.entryPrice) trig=true;
        if(ord.type==='BUY STOP' && price.ask>=ord.entryPrice) trig=true;
        if(ord.type==='SELL LIMIT' && price.bid>=ord.entryPrice) trig=true;
        if(ord.type==='SELL STOP' && price.bid<=ord.entryPrice) trig=true;
        if(trig){
          const direction = ord.type.startsWith('BUY') ? 'BUY' : 'SELL';
          positions = [{id:uid('p'), ticket:ord.ticket, symbol:ord.symbol, type:direction, volume:ord.volume, openPrice:ord.entryPrice, sl:ord.sl, tp:ord.tp, openTs:now(), commission:-(ord.volume*3.5), swap:0}, ...positions];
          const text = `Pending order triggered — ${ord.symbol} ${ord.type} filled at ${ord.entryPrice.toFixed(digitsOf(ord.symbol))}`;
          notifications = [{id:uid('nt'), text, ts:now(), read:false, kind:'info'}, ...notifications].slice(0,40);
          toasts = [...toasts, {id:uid('t'), text, kind:'info'}];
        } else {
          pendingOrders.push(ord);
        }
      });
      // alerts
      const alerts = state.alerts.map(a=>{
        if(!a.active || a.triggered) return a;
        const price = prices[a.symbol];
        const hit = a.condition==='above' ? price.mid>=a.value : price.mid<=a.value;
        if(hit){
          const text = `Price alert triggered — ${a.symbol} ${a.condition==='above'?'crossed above':'crossed below'} ${a.value.toFixed(digitsOf(a.symbol))}`;
          notifications = [{id:uid('nt'), text, ts:now(), read:false, kind:'alert'}, ...notifications].slice(0,40);
          toasts = [...toasts, {id:uid('t'), text, kind:'alert'}];
          return {...a, triggered:true, active:false};
        }
        return a;
      });
      return {...state, prices, positions, pendingOrders, history, alerts, notifications, toasts, account:{...state.account, balance}};
    }
    default: return state;
  }
}

/* ============================== CHART ============================== */
function sma(data, period){
  return data.map((d,i)=>{
    if(i<period-1) return null;
    let sum=0; for(let k=i-period+1;k<=i;k++) sum+=data[k].c;
    return sum/period;
  });
}
function ema(data, period){
  const k = 2/(period+1);
  let prev = null;
  return data.map((d,i)=>{
    if(i===0){ prev=d.c; return prev; }
    prev = d.c*k + prev*(1-k);
    return prev;
  });
}
function rsi(data, period=14){
  let gains=0, losses=0;
  const out = new Array(data.length).fill(null);
  for(let i=1;i<data.length;i++){
    const diff = data[i].c - data[i-1].c;
    const g = diff>0?diff:0, l = diff<0?-diff:0;
    if(i<=period){ gains+=g; losses+=l; if(i===period){ const rs=gains/(period)/((losses/period)||1e-9); out[i]=100-100/(1+rs); } }
    else {
      gains = (gains*(period-1)+g)/period; losses=(losses*(period-1)+l)/period;
      const rs = gains/(losses||1e-9);
      out[i] = 100-100/(1+rs);
    }
  }
  return out;
}
 
function TradingChart({symbol, price, tf, chartType, indicators, digits}){
  const [series, setSeries] = useState(()=>generateSeries(symbol, tf, price.mid));
  useEffect(()=>{ setSeries(generateSeries(symbol, tf, price.mid)); /* eslint-disable-next-line */ }, [symbol, tf]);
  useEffect(()=>{
    setSeries(prev=>{
      if(!prev.length) return prev;
      const copy = prev.slice();
      const last = {...copy[copy.length-1]};
      last.c = price.mid;
      last.h = Math.max(last.h, price.mid);
      last.l = Math.min(last.l, price.mid);
      copy[copy.length-1] = last;
      return copy;
    });
  }, [price.mid]);
 
  const W = 760, H = 340, padL = 8, padR = 56, padT = 14, padB = indicators.rsi?70:14;
  const chartH = H - padT - padB;
  const allVals = series.flatMap(d=>[d.h,d.l]);
  const maxV = Math.max(...allVals), minV = Math.min(...allVals);
  const range = (maxV-minV)||1;
  const x = i => padL + (i/(series.length-1))*(W-padL-padR);
  const y = v => padT + (1-(v-minV)/range)*chartH;
  const candleW = Math.max(2, (W-padL-padR)/series.length*0.62);
 
  const maData = indicators.ma ? sma(series,20) : null;
  const emaData = indicators.ema ? ema(series,20) : null;
  const rsiData = indicators.rsi ? rsi(series,14) : null;
 
  const linePath = (getVal) => series.map((d,i)=> (i===0?'M':'L')+x(i)+','+y(getVal(d,i))).join(' ');
 
  const up = price.dir>=0;
  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{display:'block'}}>
        {/* grid */}
        {[0,0.25,0.5,0.75,1].map((f,idx)=>{
          const v = minV+range*f;
          return (
            <g key={idx}>
              <line x1={padL} x2={W-padR} y1={y(v)} y2={y(v)} stroke="var(--border-soft)" strokeWidth="1"/>
              <text x={W-padR+6} y={y(v)+3} fontSize="9.5" fill="var(--text-faint)" className="mono">{v.toFixed(digits)}</text>
            </g>
          );
        })}
        {chartType==='candlestick' && series.map((d,i)=>{
          const color = d.c>=d.o ? 'var(--buy)' : 'var(--sell)';
          return (
            <g key={i}>
              <line x1={x(i)} x2={x(i)} y1={y(d.h)} y2={y(d.l)} stroke={color} strokeWidth="1"/>
              <rect x={x(i)-candleW/2} y={Math.min(y(d.o),y(d.c))} width={candleW} height={Math.max(1,Math.abs(y(d.o)-y(d.c)))} fill={color}/>
            </g>
          );
        })}
        {chartType==='line' && <path d={linePath(d=>d.c)} fill="none" stroke="var(--brand)" strokeWidth="1.75"/>}
        {chartType==='area' && (
          <>
            <path d={linePath(d=>d.c)+` L${x(series.length-1)},${padT+chartH} L${x(0)},${padT+chartH} Z`} fill="var(--brand-bg)"/>
            <path d={linePath(d=>d.c)} fill="none" stroke="var(--brand)" strokeWidth="1.75"/>
          </>
        )}
        {maData && <path d={series.map((d,i)=> maData[i]==null?null:(x(i)+','+y(maData[i]))).filter(Boolean).map((p,i,arr)=> (i===0?'M':'L')+p).join(' ')} fill="none" stroke="#FFB020" strokeWidth="1.5" opacity="0.9"/>}
        {emaData && <path d={linePath((d,i)=>emaData[i])} fill="none" stroke="#B98CFF" strokeWidth="1.5" opacity="0.9"/>}
        {/* current price line */}
        <line x1={padL} x2={W-padR} y1={y(price.mid)} y2={y(price.mid)} stroke={up?'var(--buy)':'var(--sell)'} strokeDasharray="3,3" strokeWidth="1"/>
        <rect x={W-padR} y={y(price.mid)-8} width={padR} height={16} fill={up?'var(--buy)':'var(--sell)'}/>
        <text x={W-padR+4} y={y(price.mid)+3.5} fontSize="9.5" fontWeight="700" fill={up?'#06231C':'#2C0A10'} className="mono">{price.mid.toFixed(digits)}</text>
 
        {indicators.rsi && rsiData && (()=>{
          const rH = 50, rTop = H-padB+8;
          const ry = v => rTop + (1-(v/100))*rH;
          return (
            <g>
              <rect x={padL} y={rTop} width={W-padL-padR} height={rH} fill="var(--panel-2)" opacity="0.4"/>
              <line x1={padL} x2={W-padR} y1={ry(70)} y2={ry(70)} stroke="var(--sell)" strokeDasharray="2,2" strokeWidth="0.75"/>
              <line x1={padL} x2={W-padR} y1={ry(30)} y2={ry(30)} stroke="var(--buy)" strokeDasharray="2,2" strokeWidth="0.75"/>
              <path d={series.map((d,i)=> rsiData[i]==null?null:(x(i)+','+ry(rsiData[i]))).filter(Boolean).map((p,i)=>(i===0?'M':'L')+p).join(' ')} fill="none" stroke="var(--brand)" strokeWidth="1.25"/>
              <text x={padL+2} y={rTop+9} fontSize="8.5" fill="var(--text-faint)" className="mono">RSI 14</text>
            </g>
          );
        })()}
      </svg>
    </div>
  );
}

/* ============================== DERIVED METRICS ============================== */
function useAccountMetrics(state){
  return useMemo(()=>{
    let usedMargin=0, floating=0;
    state.positions.forEach(p=>{
      const price = state.prices[p.symbol];
      usedMargin += calcMargin(p.symbol, p.volume, p.openPrice);
      floating += calcPnL(p, price) + p.commission + p.swap;
    });
    const equity = state.account.balance + floating;
    const freeMargin = equity - usedMargin;
    const marginLevel = usedMargin>0 ? (equity/usedMargin*100) : 0;
    const todayPnl = floating;
    return {usedMargin, floating, equity, freeMargin, marginLevel, todayPnl};
  }, [state.positions, state.prices, state.account.balance]);
}

  useEffect(()=>{ setEntryPrice(price.mid); }, [symbol]);
 
  const marginEst = calcMargin(symbol, volume, direction==='BUY'?price.ask:price.bid);
  const pipVal = calcPipValue(symbol, volume);
  const slNum = useSL ? parseFloat(sl)||0 : 0;
  const tpNum = useTP ? parseFloat(tp)||0 : 0;
  const entry = direction==='BUY'?price.ask:price.bid;
  const riskPips = slNum ? Math.abs(entry-slNum)/pipSize(symbol) : 0;
  const rewardPips = tpNum ? Math.abs(tpNum-entry)/pipSize(symbol) : 0;
  const riskAmt = riskPips*pipVal, rewardAmt = rewardPips*pipVal;
 
  function submit(){
    dispatch({type:'PLACE_ORDER', payload:{symbol, orderType, direction, volume, entryPrice: orderType==='Market'?entry:entryPrice, sl:slNum, tp:tpNum}});
    dispatch({type:'ADD_TOAST', text: orderType==='Market' ? `Demo order executed successfully — ${direction} ${symbol}` : `Pending order created — ${direction} ${orderType} ${symbol}`, kind:'success'});
    dispatch({type:'ADD_NOTIF', text: orderType==='Market' ? `Demo order executed — ${direction} ${fmt(volume,2)} lots ${symbol}` : `Pending order created — ${symbol} ${orderType}`, kind:'info'});
    setConfirmOpen(false);
  }
  function tryPlace(){
    if(state.settings.confirmBeforeOrder && !state.settings.oneClickTrading) setConfirmOpen(true); else submit();
  }
 
  return (
    <Panel className="p-4">
      <div className="flex items-center justify-between mb-3">
        <div>
          <div className="text-[15px] font-bold" style={{color:'var(--text)'}}>{symbol}</div>
          <div className="text-[10.5px]" style={{color:'var(--text-faint)'}}>{inst.group} · Leverage 1:{LEVERAGE}</div>
        </div>
        <div className="text-right">
          <div className="mono text-[11px]" style={{color:'var(--text-dim)'}}>Spread</div>
          <div className="mono text-[12px] font-semibold" style={{color:'var(--text)'}}>{((price.ask-price.bid)/pipSize(symbol)).toFixed(1)} pips</div>
        </div>
      </div>
      <div className="grid grid-cols-2 gap-2 mb-3">
        <button onClick={()=>setDirection('SELL')} className="rounded-md py-2.5 text-center focus-ring" style={{background: direction==='SELL'?'var(--sell-bg)':'var(--panel-2)', border:'1px solid '+(direction==='SELL'?'var(--sell)':'var(--border)')}}>
          <div className="text-[10px] font-semibold" style={{color:'var(--sell)'}}>SELL</div>
          <div className="mono text-base font-bold" style={{color:'var(--sell)'}}>{price.bid.toFixed(digits)}</div>
        </button>
        <button onClick={()=>setDirection('BUY')} className="rounded-md py-2.5 text-center focus-ring" style={{background: direction==='BUY'?'var(--buy-bg)':'var(--panel-2)', border:'1px solid '+(direction==='BUY'?'var(--buy)':'var(--border)')}}>
          <div className="text-[10px] font-semibold" style={{color:'var(--buy)'}}>BUY</div>
          <div className="mono text-base font-bold" style={{color:'var(--buy)'}}>{price.ask.toFixed(digits)}</div>
        </button>
      </div>
      <Field label="Order Type">
        <div className="grid grid-cols-3 gap-1.5">
          {['Market','Limit','Stop'].map(t=>(
            <button key={t} onClick={()=>setOrderType(t)} className="py-1.5 rounded-md text-xs font-semibold focus-ring" style={{background: orderType===t?'var(--brand-bg)':'var(--panel-2)', color: orderType===t?'var(--brand)':'var(--text-dim)', border:'1px solid '+(orderType===t?'var(--brand)':'var(--border)')}}>{t}</button>
          ))}
        </div>
      </Field>
      {orderType!=='Market' && (
        <Field label={orderType+' Entry Price'}>
          <TextInput type="number" step={pipSize(symbol)} value={entryPrice} onChange={e=>setEntryPrice(parseFloat(e.target.value)||0)}/>
        </Field>
      )}
      <Field label="Volume (Lots)">
        <div className="flex items-center gap-2">
          <button onClick={()=>setVolume(v=>Math.max(0.01, Math.round((v-0.01)*100)/100))} className="w-8 h-8 rounded-md flex items-center justify-center focus-ring" style={{background:'var(--panel-2)', border:'1px solid var(--border)'}}><Icon name="minus" size={14}/></button>
          <TextInput type="number" step="0.01" min="0.01" value={volume} onChange={e=>setVolume(parseFloat(e.target.value)||0.01)} className="text-center"/>
          <button onClick={()=>setVolume(v=>Math.round((v+0.01)*100)/100)} className="w-8 h-8 rounded-md flex items-center justify-center focus-ring" style={{background:'var(--panel-2)', border:'1px solid var(--border)'}}><Icon name="plus" size={14}/></button>
        </div>
      </Field>
      <div className="grid grid-cols-2 gap-3 mb-1">
        <Field label={<span className="flex items-center gap-1.5"><input type="checkbox" checked={useSL} onChange={e=>setUseSL(e.target.checked)}/> Stop Loss</span>}>
          <TextInput type="number" step={pipSize(symbol)} disabled={!useSL} value={sl} onChange={e=>setSl(e.target.value)} placeholder={entry.toFixed(digits)}/>
        </Field>
        <Field label={<span className="flex items-center gap-1.5"><input type="checkbox" checked={useTP} onChange={e=>setUseTP(e.target.checked)}/> Take Profit</span>}>
          <TextInput type="number" step={pipSize(symbol)} disabled={!useTP} value={tp} onChange={e=>setTp(e.target.value)} placeholder={entry.toFixed(digits)}/>
        </Field>
      </div>
      <div className="rounded-md p-3 my-3 space-y-1.5 text-[12px]" style={{background:'var(--panel-2)'}}>
        <div className="flex justify-between"><span style={{color:'var(--text-dim)'}}>Estimated Margin</span><span className="mono font-medium" style={{color:'var(--text)'}}>{fmtMoney(marginEst)}</span></div>
        <div className="flex justify-between"><span style={{color:'var(--text-dim)'}}>Pip Value</span><span className="mono font-medium" style={{color:'var(--text)'}}>{fmtMoney(pipVal)}</span></div>
        {useSL && <div className="flex justify-between"><span style={{color:'var(--text-dim)'}}>Potential Risk</span><span className="mono font-medium" style={{color:'var(--sell)'}}>{fmtMoney(riskAmt)}</span></div>}
        {useTP && <div className="flex justify-between"><span style={{color:'var(--text-dim)'}}>Potential Reward</span><span className="mono font-medium" style={{color:'var(--buy)'}}>{fmtMoney(rewardAmt)}</span></div>}
        {useSL && useTP && riskAmt>0 && <div className="flex justify-between"><span style={{color:'var(--text-dim)'}}>Risk/Reward Ratio</span><span className="mono font-medium" style={{color:'var(--text)'}}>1:{(rewardAmt/riskAmt).toFixed(2)}</span></div>}
      </div>
      <Button variant={direction==='BUY'?'buy':'sell'} size="lg" className="w-full" onClick={tryPlace}>{direction} {symbol}</Button>
 
      {confirmOpen && (
        <Modal title="Confirm Order" onClose={()=>setConfirmOpen(false)} width={380}>
          <p className="text-sm mb-4" style={{color:'var(--text-dim)'}}>Place a {orderType.toLowerCase()} {direction.toLowerCase()} order for <b style={{color:'var(--text)'}}>{fmt(volume,2)} lots</b> of <b style={{color:'var(--text)'}}>{symbol}</b>?</p>
          <div className="flex gap-2">
            <Button variant="outline" className="flex-1" onClick={()=>setConfirmOpen(false)}>Cancel</Button>
            <Button variant={direction==='BUY'?'buy':'sell'} className="flex-1" onClick={submit}>Confirm</Button>
          </div>
        </Modal>
      )}
    </Panel>
  );
}

function HistoryPage({state}){
  const [q,setQ] = useState('');
  const [symF,setSymF] = useState('All');
  const [dirF,setDirF] = useState('All');
  const [plF,setPlF] = useState('All');
  let rows = state.history;
  if(symF!=='All') rows = rows.filter(r=>r.symbol===symF);
  if(dirF!=='All') rows = rows.filter(r=>r.type===dirF);
  if(plF==='Profit') rows = rows.filter(r=>r.profit>=0);
  if(plF==='Loss') rows = rows.filter(r=>r.profit<0);
  if(q) rows = rows.filter(r=>r.symbol.toLowerCase().includes(q.toLowerCase()));
 
  function exportCSV(){
    const header = 'Date,Ticket,Symbol,Type,Volume,Entry,Exit,Commission,Swap,Profit\n';
    const body = rows.map(r=>[fmtDate(r.closeTs), r.ticket, r.symbol, r.type, r.volume, r.entry.toFixed(r.digits), r.exit.toFixed(r.digits), r.commission.toFixed(2), r.swap.toFixed(2), r.profit.toFixed(2)].join(',')).join('\n');
    const blob = new Blob([header+body], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='trade-history.csv'; a.click(); URL.revokeObjectURL(url);

  const totalPnl = rows.reduce((s,r)=>s+r.profit,0);

        <Select value={dirF} onChange={e=>setDirF(e.target.value)} options={['All','BUY','SELL']} className="w-28"/>
        <Select value={plF} onChange={e=>setPlF(e.target.value)} options={['All','Profit','Loss']} className="w-28"/>
      </div>
      <div className="text-[12.5px]" style={{color:'var(--text-dim)'}}>{rows.length} trades · Net P&L <b className="mono" style={{color: totalPnl>=0?'var(--buy)':'var(--sell)'}}>{fmtMoney(totalPnl,{plus:true})}</b></div>
      <Panel className="overflow-hidden">
        <div className="scrollx">
          <table className="w-full">
            <thead style={{background:'var(--panel-2)'}}>
              <tr>{['Date','Ticket','Symbol','Type','Volume','Entry','Exit','Duration','Commission','Swap','P&L'].map(h=><th key={h} className="text-left px-3 py-2 text-[10.5px] font-semibold whitespace-nowrap" style={{color:'var(--text-faint)'}}>{h}</th>)}</tr>

                  <td className="px-3 py-2 text-[11.5px]" style={{color:'var(--text-dim)'}}>{fmtDate(r.closeTs)}</td>

function AnalyticsPage({state}){
  const wins = state.history.filter(h=>h.profit>0);
  const losses = state.history.filter(h=>h.profit<=0);
  const winRate = state.history.length ? (wins.length/state.history.length*100) : 0;
  const avgWin = wins.length ? wins.reduce((s,h)=>s+h.profit,0)/wins.length : 0;
  const avgLoss = losses.length ? losses.reduce((s,h)=>s+h.profit,0)/losses.length : 0;
  const totalPnl = state.history.reduce((s,h)=>s+h.profit,0);
  const profitFactor = Math.abs(avgLoss*losses.length) > 0 ? (avgWin*wins.length)/Math.abs(avgLoss*losses.length) : 0;
  const largestWin = wins.length? Math.max(...wins.map(h=>h.profit)):0;
  const largestLoss = losses.length? Math.min(...losses.map(h=>h.profit)):0;
  const avgDur = state.history.length ? state.history.reduce((s,h)=>s+(h.closeTs-h.openTs),0)/state.history.length/60000 : 0;
 
  let running = 25000;
  const eq = state.history.slice().reverse().map(h=>{ running+=h.profit; return running; });
  const eqMax = Math.max(...eq, running), eqMin = Math.min(...eq, running);
  const eqPath = eq.map((v,i)=>{ const px = (i/(eq.length-1||1))*680; const py = 120 - ((v-eqMin)/((eqMax-eqMin)||1))*110; return (i===0?'M':'L')+px+','+py; }).join(' ');
 
  const bySymbol = {};
  state.history.forEach(h=>{ bySymbol[h.symbol]=(bySymbol[h.symbol]||0)+h.profit; });
  const symEntries = Object.entries(bySymbol);
  const maxAbs = Math.max(...symEntries.map(([,v])=>Math.abs(v)), 1);
 
  return (
    <div className="p-4 md:p-6 space-y-5">
      <h1 className="text-xl font-bold" style={{color:'var(--text)'}}>Analytics / Performance</h1>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <StatCard label="Total P&L" value={fmtMoney(totalPnl,{plus:true})} tone={totalPnl>=0?'buy':'sell'}/>
        <StatCard label="Win Rate" value={winRate.toFixed(1)+'%'}/>
        <StatCard label="Profit Factor" value={profitFactor.toFixed(2)}/>
        <StatCard label="Total Trades" value={state.history.length}/>
        <StatCard label="Winning Trades" value={wins.length} tone="buy"/>
        <StatCard label="Losing Trades" value={losses.length} tone="sell"/>
        <StatCard label="Avg Win" value={fmtMoney(avgWin)} tone="buy"/>
        <StatCard label="Avg Loss" value={fmtMoney(avgLoss)} tone="sell"/>
        <StatCard label="Largest Win" value={fmtMoney(largestWin)} tone="buy"/>
        <StatCard label="Largest Loss" value={fmtMoney(largestLoss)} tone="sell"/>
        <StatCard label="Avg Trade Duration" value={Math.round(avgDur)+'m'}/>
        <StatCard label="Account Equity" value={fmtMoney(running)}/>
      </div>
      <Panel className="p-4">
        <h2 className="text-sm font-semibold mb-3" style={{color:'var(--text)'}}>Equity Curve</h2>
        <svg viewBox="0 0 680 130" width="100%">
          <path d={eqPath} fill="none" stroke="var(--brand)" strokeWidth="2"/>
        </svg>
      </Panel>
      <Panel className="p-4">
        <h2 className="text-sm font-semibold mb-3" style={{color:'var(--text)'}}>Performance by Currency Pair</h2>
        <div className="space-y-2">
          {symEntries.map(([sym,val])=>(
            <div key={sym} className="flex items-center gap-3">
              <span className="text-[12px] w-16 shrink-0" style={{color:'var(--text-dim)'}}>{sym}</span>
              <div className="flex-1 h-4 rounded overflow-hidden" style={{background:'var(--panel-2)'}}>
                <div className="h-full" style={{width:(Math.abs(val)/maxAbs*100)+'%', background: val>=0?'var(--buy)':'var(--sell)'}}/>
              </div>
              <span className="text-[12px] mono w-20 text-right" style={{color: val>=0?'var(--buy)':'var(--sell)'}}>{fmtMoney(val,{plus:true})}</span>
            </div>
          ))}
        </div>
      </Panel>
    </div>
  );
}

          <Field label="Report Type"><Select value={type} onChange={e=>setType(e.target.value)} options={types}/></Field>
          <Field label="Instrument Filter"><Select value="All Instruments" onChange={()=>{}} options={['All Instruments', ...INSTRUMENTS.map(i=>i.symbol)]}/></Field>
          <Field label="From"><TextInput type="date" defaultValue={new Date(now()-30*86400000).toISOString().slice(0,10)}/></Field>
          <Field label="To"><TextInput type="date" defaultValue={new Date().toISOString().slice(0,10)}/></Field>
        </div>
        <div className="flex gap-2">
          <Button variant="brand" onClick={exportCSV}><Icon name="download" size={14}/> Export CSV</Button>
          <Button variant="outline" onClick={()=>window.print()}><Icon name="file" size={14}/> Download PDF</Button>
        </div>
      </Panel>
      <Panel className="p-4">
        <h2 className="text-sm font-semibold mb-3" style={{color:'var(--text)'}}>{type} Preview</h2>
        <p className="text-[12.5px] mb-3" style={{color:'var(--text-dim)'}}>Generated from {state.history.length} demo trades between {fmtDate(state.history[state.history.length-1]?.closeTs||now())} and {fmtDate(state.history[0]?.closeTs||now())}.</p>
        <div className="grid grid-cols-3 gap-3">
          <StatCard label="Net P&L" value={fmtMoney(state.history.reduce((s,h)=>s+h.profit,0),{plus:true})}/>
          <StatCard label="Trades" value={state.history.length}/>
          <StatCard label="Commission Paid" value={fmtMoney(Math.abs(state.history.reduce((s,h)=>s+h.commission,0)))}/>
        </div>
      </Panel>
    </div>
  );
}
 
function ProfilePage({state,dispatch}){
  const [name,setName] = useState(state.account.name);
  const [email,setEmail] = useState(state.account.email);
  const [phone,setPhone] = useState(state.account.phone);
  const [country,setCountry] = useState(state.account.country);
  const [editing,setEditing] = useState(false);
  return (
    <div className="p-4 md:p-6 space-y-4">
      <h1 className="text-xl font-bold" style={{color:'var(--text)'}}>Profile</h1>
      <Panel className="p-5" style={{maxWidth:520}}>
        <div className="flex items-center gap-4 mb-5">
          <div className="w-16 h-16 rounded-full flex items-center justify-center text-xl font-bold" style={{background:'var(--brand-bg)', color:'var(--brand)'}}>{name.split(' ').map(n=>n[0]).join('')}</div>
          <div>
            <div className="font-semibold" style={{color:'var(--text)'}}>{name}</div>
            <div className="text-[12px]" style={{color:'var(--text-faint)'}}>Account ID: {state.account.id}</div>
            <Badge tone="brand" className="mt-1">Demo Account</Badge>
          </div>
        </div>
        {editing ? (
          <>
            <Field label="Full Name"><TextInput value={name} onChange={e=>setName(e.target.value)}/></Field>
            <Field label="Email"><TextInput value={email} onChange={e=>setEmail(e.target.value)}/></Field>
            <Field label="Phone"><TextInput value={phone} onChange={e=>setPhone(e.target.value)}/></Field>
            <Field label="Country"><TextInput value={country} onChange={e=>setCountry(e.target.value)}/></Field>
            <div className="flex gap-2 mt-2">
              <Button variant="outline" className="flex-1" onClick={()=>setEditing(false)}>Cancel</Button>
              <Button variant="brand" className="flex-1" onClick={()=>{dispatch({type:'UPDATE_PROFILE', patch:{name,email,phone,country}}); dispatch({type:'ADD_TOAST', text:'Profile updated.', kind:'success'}); setEditing(false);}}>Save Changes</Button>
            </div>
          </>
        ) : (
          <>
            <div className="space-y-2.5 text-[13px] mb-4">
              <div className="flex justify-between"><span style={{color:'var(--text-dim)'}}>Email</span><span style={{color:'var(--text)'}}>{state.account.email}</span></div>
              <div className="flex justify-between"><span style={{color:'var(--text-dim)'}}>Phone</span><span style={{color:'var(--text)'}}>{state.account.phone}</span></div>
              <div className="flex justify-between"><span style={{color:'var(--text-dim)'}}>Country</span><span style={{color:'var(--text)'}}>{state.account.country}</span></div>
              <div className="flex justify-between"><span style={{color:'var(--text-dim)'}}>Demo account status</span><Badge tone="buy">Active</Badge></div>
            </div>
            <Button variant="outline" onClick={()=>setEditing(true)}><Icon name="edit" size={14}/> Edit Profile</Button>
          </>
        )}
      </Panel>
    </div>
  );
}
 
function SettingsPage({state,dispatch}){
  const S = state.settings;
  const patch = p => dispatch({type:'UPDATE_SETTINGS', patch:p});
  return (
    <div className="p-4 md:p-6 space-y-4" style={{maxWidth:640}}>
      <h1 className="text-xl font-bold" style={{color:'var(--text)'}}>Settings</h1>
      <Panel className="p-5">
        <h2 className="text-sm font-semibold mb-3" style={{color:'var(--text)'}}>Trading Settings</h2>
        <Field label="Default Lot Size"><TextInput type="number" step="0.01" value={S.defaultLot} onChange={e=>patch({defaultLot:parseFloat(e.target.value)||0.01})}/></Field>
        <Field label="Default Order Type"><Select value={S.defaultOrderType} onChange={e=>patch({defaultOrderType:e.target.value})} options={['Market','Limit','Stop']}/></Field>
        <Toggle checked={S.confirmBeforeOrder} onChange={v=>patch({confirmBeforeOrder:v})} label="Confirmation before order"/>
        <Toggle checked={S.oneClickTrading} onChange={v=>patch({oneClickTrading:v})} label="One-click trading"/>
      </Panel>
      <Panel className="p-5">
        <h2 className="text-sm font-semibold mb-3" style={{color:'var(--text)'}}>Chart Settings</h2>
        <Field label="Default Timeframe"><Select value={S.chartDefaultTF} onChange={e=>patch({chartDefaultTF:e.target.value})} options={['1m','5m','15m','30m','1H','4H','1D','1W','1M']}/></Field>
        <Field label="Default Chart Type"><Select value={S.chartDefaultType} onChange={e=>patch({chartDefaultType:e.target.value})} options={['candlestick','line','area']}/></Field>
        <Toggle checked={S.showGrid} onChange={v=>patch({showGrid:v})} label="Show grid"/>
        <Toggle checked={S.showVolume} onChange={v=>patch({showVolume:v})} label="Show volume"/>
      </Panel>
      <Panel className="p-5">
        <h2 className="text-sm font-semibold mb-3" style={{color:'var(--text)'}}>Notification Settings</h2>
        <Toggle checked={S.notifyAlerts} onChange={v=>patch({notifyAlerts:v})} label="Price alerts"/>
        <Toggle checked={S.notifyTrades} onChange={v=>patch({notifyTrades:v})} label="Trade notifications"/>
        <Toggle checked={S.notifyEvents} onChange={v=>patch({notifyEvents:v})} label="Economic events"/>
        <Toggle checked={S.notifyNews} onChange={v=>patch({notifyNews:v})} label="News notifications"/>
      </Panel>
      <Panel className="p-5">
        <h2 className="text-sm font-semibold mb-3" style={{color:'var(--text)'}}>Appearance</h2>
        <div className="grid grid-cols-2 gap-2 mb-3">
          <button onClick={()=>dispatch({type:'SET_THEME', theme:'dark'})} className="py-2.5 rounded-md text-sm font-semibold focus-ring flex items-center justify-center gap-2" style={{background: state.theme==='dark'?'var(--brand-bg)':'var(--panel-2)', color: state.theme==='dark'?'var(--brand)':'var(--text-dim)', border:'1px solid '+(state.theme==='dark'?'var(--brand)':'var(--border)')}}><Icon name="moon" size={14}/> Dark</button>
          <button onClick={()=>dispatch({type:'SET_THEME', theme:'light'})} className="py-2.5 rounded-md text-sm font-semibold focus-ring flex items-center justify-center gap-2" style={{background: state.theme==='light'?'var(--brand-bg)':'var(--panel-2)', color: state.theme==='light'?'var(--brand)':'var(--text-dim)', border:'1px solid '+(state.theme==='light'?'var(--brand)':'var(--border)')}}><Icon name="sun" size={14}/> Light</button>
        </div>
        <Toggle checked={S.compactMode} onChange={v=>patch({compactMode:v})} label="Compact mode"/>
      </Panel>
      <Panel className="p-5">
        <h2 className="text-sm font-semibold mb-3" style={{color:'var(--text)'}}>Language</h2>
        <Select value={S.language} onChange={e=>patch({language:e.target.value})} options={['English','Español','Français','Deutsch','Português']}/>
      </Panel>
    </div>
  );
}
 
function HelpPage(){
  const faqs = [
    ['Is this a real trading platform?', 'No. Voltrix Markets Demo is a frontend-only prototype for demonstration purposes. No real money, orders, or broker connections are involved.'],
    ['How does the price simulation work?', 'Prices update automatically every few seconds using a simulated random walk to mimic live market movement.'],
    ['Can I lose real money here?', 'No — all balances, positions and trades exist only in your browser session and reset if the app is refreshed.'],
    ['How do I place a demo trade?', 'Go to Trade, choose an instrument, set your volume and optional Stop Loss / Take Profit, then click Buy or Sell.'],
  ];
  return (
    <div className="p-4 md:p-6 space-y-4" style={{maxWidth:640}}>
      <h1 className="text-xl font-bold" style={{color:'var(--text)'}}>Help & Support</h1>
      <Panel className="p-5 space-y-4">
        {faqs.map(([q,a])=>(
          <div key={q}>
            <h3 className="text-sm font-semibold mb-1" style={{color:'var(--text)'}}>{q}</h3>
            <p className="text-[12.5px]" style={{color:'var(--text-dim)'}}>{a}</p>
          </div>
        ))}
      </Panel>
      <Panel className="p-5 flex items-center gap-3">
        <Icon name="mail" size={18} style={{color:'var(--brand)'}}/>
        <div><div className="text-sm font-medium" style={{color:'var(--text)'}}>support@voltrixmarkets-demo.example</div><div className="text-[11.5px]" style={{color:'var(--text-faint)'}}>Demo support inbox — for illustration only</div></div>
      </Panel>
    </div>
  );
}
 
/* ============================== APP ROOT ============================== */
function App(){
  const [state, dispatch] = useReducer(reducer, undefined, initialState);
  const [mobileOpen, setMobileOpen] = useState(false);
 
  useEffect(()=>{ document.documentElement.setAttribute('data-theme', state.theme); }, [state.theme]);
  useEffect(()=>{
    if(!state.liveSim) return;
    const id = setInterval(()=>dispatch({type:'TICK'}), 2000);
    return ()=>clearInterval(id);
  }, [state.liveSim]);
 
  if(state.page==='login') return <LoginScreen dispatch={dispatch}/>;
 
  const pages = {
    dashboard: <DashboardPage state={state} dispatch={dispatch}/>,
    markets: <MarketsPage state={state} dispatch={dispatch}/>,
    trade: <TradePage state={state} dispatch={dispatch}/>,
    positions: <PositionsPage state={state} dispatch={dispatch}/>,
    orders: <PendingOrdersPage state={state} dispatch={dispatch}/>,
    history: <HistoryPage state={state}/>,
    watchlist: <WatchlistPage state={state} dispatch={dispatch}/>,
    calendar: <EconomicCalendarPage state={state}/>,
    news: <NewsPage state={state}/>,
    alerts: <AlertsPage state={state} dispatch={dispatch}/>,
    analytics: <AnalyticsPage state={state}/>,
    reports: <ReportsPage state={state}/>,
    wallet: <WalletPage state={state} dispatch={dispatch}/>,
    settings: <SettingsPage state={state} dispatch={dispatch}/>,
    profile: <ProfilePage state={state} dispatch={dispatch}/>,
    help: <HelpPage/>,
  };
 
  return (
    <div className="flex h-screen overflow-hidden" style={{background:'var(--bg)'}}>
      <Sidebar state={state} dispatch={dispatch} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen}/>
      <div className="flex-1 flex flex-col min-w-0">
        <Topbar state={state} dispatch={dispatch} setMobileOpen={setMobileOpen}/>
        <div className="flex-1 overflow-y-auto pb-16 md:pb-0">
          {pages[state.page] || pages.dashboard}
        </div>
      </div>
      <MobileNav state={state} dispatch={dispatch} setMobileOpen={setMobileOpen}/>
      <ToastContainer toasts={state.toasts} dispatch={dispatch}/>
    </div>
  );
}
 
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
